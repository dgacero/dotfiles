[general]
live_config_reload = true

[font]
size = 14

[font.normal]
family = "JetBrains Mono"
style = "Regular"

# Nord palette with custom darker color #242933
# See https://github.com/alacritty/alacritty-theme/blob/master/themes/nord.toml
[colors.primary]
background = "#242933"
foreground = "#d8dee9"

[colors.normal]
black   = "#3b4252"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#81a1c1"
magenta = "#b48ead"
cyan    = "#88c0d0"
white   = "#e5e9f0"

[colors.bright]
black   = "#4c566a"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#81a1c1"
magenta = "#b48ead"
cyan    = "#8fbcbb"
white   = "#eceff4"
