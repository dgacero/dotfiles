# Switch to Latin America keyboard layout
# Usage: tmux source-file ~/.config/tmux/tmux-la.conf

# Remap prefix key to |
unbind `
set-option -g prefix |
bind | send-prefix

# Split panes horizontally using +
unbind \\
bind + split-window -h -c "#{pane_current_path}"

display-popup -w 50 -h 5 "printf 'Switched to Latin America layout\nprefix=|, horizontal split=+\nPress escape to exit'"
