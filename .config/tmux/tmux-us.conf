# Switch to US keyboard layout
# Usage: tmux source-file ~/.config/tmux/tmux-us.conf

# Remap prefix key to `
unbind |
set-option -g prefix `
bind ` send-prefix

# Split panes horizontally using backslash
unbind +
bind \\ split-window -h -c "#{pane_current_path}"

display-popup -w 50 -h 5 "printf 'Switched to US layout\nprefix=\`, horizontal split=\\\\\nPress escape to exit'"
